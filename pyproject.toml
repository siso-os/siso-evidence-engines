[project]
name = "siso-evidence-engines"
version = "0.1.0"
description = "Evidence-gated knowledge, principles, and idea engines"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
siso-evidence-engines = "siso_evidence_engines.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
